    <script>
      (function() {
        // Global error suppression for fetch property setter issues
        var suppressFetchError = function(msg) {
          return typeof msg === 'string' && msg.indexOf('fetch') !== -1;
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (suppressFetchError(message) || (error && suppressFetchError(error.message))) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (
            event &&
            (
              suppressFetchError(event.message) ||
              (event.error && suppressFetchError(event.error.message))
            )
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            suppressFetchError(event.reason.message || String(event.reason))
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);

        // Ensure window.fetch has both getter and setter so window.fetch = ... never throws
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _f;
            },
            set: function(fn) {
              _f = fn;
            }
          });
        } catch (e) {
          try {
            var proto = Window.prototype;
            var _pf = proto.fetch || window.fetch;
            Object.defineProperty(proto, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _pf;
              },
              set: function(fn) {
                _pf = fn;
              }
            });
          } catch (e2) {}
        }
      })();
    </script>
